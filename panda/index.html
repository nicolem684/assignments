<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Pandanomics</title>
        <meta name="viewport" content="initial-scale=1, maxium-scale=1, user-scalable=no" />
        <script src='https://api.tiles.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js'></script>
        <link href='https://api.tiles.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css' rel='stylesheet' />
        <link rel="stylesheet" href="styles.css"/>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cause:wght@100..900&family=MedievalSharp&family=Oregano:ital@0;1&family=Story+Script&family=Winky+Rough:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <header>
            <h1>Pandanomics</h1>
            <h2>Here is just a small snippet of filler text to test out what the font looks like.</h2>
            <hr>
        </header>

        <div id="main">
            <section id="intro">
                <article id="introText">
                    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
                </article>
            </section>

            <br>

            <section id="content">
                <section id="sidebar">
                    <h1 id="csv-zooName">Zoo Name</h1>
                    <h2 id="csv-country">Country</h2>
                    <article id="generalInfo">General Info</article>
                    <div id="timeline">
                        <p>Timeline</p>
                    </div>
                    <div class="panda" id="panda1">
                        <p class="pandaName" id="pandaName1">Panda 1</p>
                    </div>
                    <div class="panda" id="panda2">
                        <p class="pandaName" id="pandaName2">Panda 2</p>
                    </div>
                    <div class="panda" id="panda3">
                        <p class="pandaName" id="pandaName3">Panda 3</p>
                    </div>
                    <div class="panda" id="panda4">
                        <p class="pandaName" id="pandaName4">Panda 4</p>
                    </div>
                </section>

                <div id="map"></div>
            </section>
        </div>

        <footer></footer>

        <script>
            mapboxgl.accessToken = "pk.eyJ1Ijoibm1hbjQiLCJhIjoiY21wNXpycG5uMGdnNDJxbzhrYzF3cXhtZyJ9.FU0wGPTgG5sgUMMBkGRXXA";

            var map = new mapboxgl.Map({
                container: 'map',
                style: 'mapbox://styles/nman4/cmom1azlf003n01soadh5fl99',
                center: [10,0],
                zoom: .8
            });

            // Listen for clicks on the points layer
            map.on('click', 'panda-locations', async(e) => {
                if (e.features && e.features.length > 0) {
                    const feature = e.features[0];

                    // Grab the zoo name property from the Mapbox feature click event
                    const clickedZoo = feature.properties.Zoo || feature.properties.zoo || feature.properties.Name;
                    console.log('Feature clicked:', clickedZoo);

                    if (clickedZoo) {
                        await loadCSV(clickedZoo);
                    } else {
                        console.error("Could not find a 'Zoo' property on the clicked map feature. Check your Mapbox studio property names.");
                    }
                }
            });

            // Change cursor to pointer when hovering over data layer
            map.on('mouseenter', 'panda-locations', () => { map.getCanvas().style.cursor = 'pointer'; });
            map.on('mouseleave', 'panda-locations', () => { map.getCanvas().style.cursor = ''; });

            // Helper function to safely parse CSV rows considering quotation marks
            function parseCSVRow(rowText) {
                // Regex matches commas outside of quotation marks
                const matches = rowText.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || rowText.split(',');
                return matches.map(val => val.replace(/^"|"$/g, '').trim());
            }

            async function loadCSV(targetZooName) {
                try {
                    const response = await fetch('https://docs.google.com/spreadsheets/d/e/2PACX-1vQ4Qnv-0lO-seji1VaNIzQYa_bViKMrKSzT9YvDgePJiNUxEqysWgVt9LsdAK19AsMMBDBSUEY5xndp/pub?gid=1155525306&single=true&output=csv');
                    const csvText = await response.text();

                    // Split text into rows while removing hidden carriage returns (\r)
                    const rows = csvText.replace(/\r/g, "").split("\n");

                    // Identify index positions safely based on headers
                    const headers = parseCSVRow(rows[0]).map(h => h.toLowerCase());
                    const zooIndex = headers.indexOf('zoo');
                    const countryIndex = headers.indexOf('country');

                    if (zooIndex === -1 || countryIndex === -1) {
                        console.error("Could not find matching 'Zoo' or 'Country' headers in your CSV columns. Found headers:", headers);
                        return;
                    }

                    let foundMatch = false;

                    // Loop through data rows (skipping the header row)
                    for (let i = 1; i < rows.length; i++) {
                        if (!rows[i].trim()) continue; // Skip empty lines
                        
                        const columns = parseCSVRow(rows[i]);
                        if (!columns[zooIndex]) continue;

                        const currentZooName = columns[zooIndex];

                        // Check if this row matches the clicked Mapbox map point
                        if (currentZooName.toLowerCase() === targetZooName.trim().toLowerCase()) {
                            const countryValue = columns[countryIndex] || "Unknown Country";

                            // Update the HTML text content
                            document.getElementById('csv-zooName').textContent = currentZooName;
                            document.getElementById('csv-country').textContent = countryValue;
                            
                            foundMatch = true;
                            break; // Stop looking once found
                        }
                    }

                    if (!foundMatch) {
                        console.warn(`No matching data found in CSV for zoo name: "${targetZooName}"`);
                    }
                }
                catch (error) {
                    console.error('Error loading or processing CSV:', error);
                }
            }
        </script>
    </body>
</html>
